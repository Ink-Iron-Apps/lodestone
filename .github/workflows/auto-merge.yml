name: auto-merge

on:
  push:
    branches: [claude/dev]

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge claude/dev into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main claude/dev
          git checkout main
          git merge --no-ff origin/claude/dev -m "chore: auto-merge claude/dev [skip ci]"
          git push origin main
