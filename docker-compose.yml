name: lodestone

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lodestone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lodestone}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied only on first boot of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Stock defaults are sized for a small database and cost this workload far
    # more than the crawl delay does. Measured on the live corpus: fetching a
    # page takes 0.24s, while writing 25 rows has a median of 1.9s and a p90 of
    # 29s. That bimodal shape is checkpoint and GIN-flush stalls, not steady
    # cost -- 160MB of shared_buffers against an 11GB table, and a 1GB WAL
    # ceiling forcing a 300-400MB checkpoint every five minutes.
    # Docker defaults /dev/shm to 64MB, which parallel query workers exhaust on
    # a corpus this size ("could not resize shared memory segment").
    shm_size: 1gb
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=8GB
      -c min_wal_size=1GB
      -c checkpoint_timeout=30min
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c synchronous_commit=off
      -c random_page_cost=1.1
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c log_min_duration_statement=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lodestone} -d ${POSTGRES_DB:-lodestone}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LODESTONE_DSN: postgresql://${POSTGRES_USER:-lodestone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lodestone}
    # Read-only service: it issues no writes and needs no residential egress, so
    # unlike the crawler this is the piece that can be exposed publicly.
    ports:
      - "127.0.0.1:8099:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  crawler:
    build: ./crawler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LODESTONE_DSN: postgresql://${POSTGRES_USER:-lodestone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lodestone}
    # The crawler must egress from a residential IP. Cloudflare blocks
    # datacenter ASNs outright, so running this container on a VPS will get a
    # flat 403 no matter how polite it is. Host networking keeps it on the
    # machine's own connection.
    network_mode: host
    command: ["python", "-m", "lodestone_crawler", "justin"]

volumes:
  postgres-data:
  meili-data:
